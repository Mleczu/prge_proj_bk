x-environment:
  - &env-postgres-db POSTGRES_DB=${POSTGRES_DB}
  - &env-postgres-user POSTGRES_USER=${POSTGRES_USER}
  - &env-postgres-password POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  - &env-postgres-port POSTGRES_PORT=${POSTGRES_PORT}
  - &env-geoserver-admin-user GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER}
  - &env-geoserver-admin-password GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
  - &env-geoserver-port GEOSERVER_PORT=${GEOSERVER_PORT}

services:
  postgis:
    build:
      context: ..
      dockerfile: docker/postgis/Dockerfile
    image: 'postgis_prge'
    container_name: 'postgis_prge_${ENV_NAME}'
    environment:
      - *env-postgres-db
      - *env-postgres-user
      - *env-postgres-password
    ports:
      - *env-postgres-port:5432
    volumes:
      - postgis-data:/var/lib/postgresql/data

  geoserver:
    build:
      context: ..
      dockerfile: docker/geoserver/Dockerfile
    image: 'geoserver_prge'
    container_name: 'geoserver_prge_${ENV_NAME'
    ports:
      - *env-geoserver-port:8080
    environment:
      - *env-geoserver-admin-user
      - *env-geoserver-admin-password
    volumes:
      - geoserver-data:/opt/geoserver_data


volumes:
  postgis-data:
  geoserver-data: